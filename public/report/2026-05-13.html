<style>
/* ── Theme tokens (Obsidian default) ──────────────────── */
:root {
  --bg:#080809; --surface:#151518; --raised:#24242A; --border:#3A3A42;
  --text:#F2F2F3; --text-mid:#9898A4; --muted:#84849A;
  --accent:#5CC63A; --accent-soft:#142810;
  --gradient:radial-gradient(ellipse at 50% -10%, #22223A 0%, #080809 60%);
  --shadow:0 1px 3px rgba(0,8,24,.14),0 1px 2px rgba(0,8,24,.10);

  --font:'Outfit','DM Sans',sans-serif;
  --mono:'DM Mono','Courier New',monospace;
  --r-sm:4px; --r-md:10px; --r-lg:14px; --r-pill:999px;

  --orange:#D88058; --yellow:#D4C462; --purple:#9480C4; --blue:#5C9CE8;
}

/* ── Reset ──────────────────────────────────────────────── */
*,*::before,*::after {box-sizing:border-box;margin:0;padding:0}
body {
  font-family:var(--font);font-size:14px;color:var(--text);
  background:var(--bg);line-height:1.5;
  transition:background .2s,color .2s;
}
.page {
  max-width:980px;margin:0 auto;padding:48px 32px 80px;
  background:var(--gradient);min-height:100vh;background-attachment:fixed;
}

/* ── Page header ────────────────────────────────────────── */
.page-header {
  display:flex;align-items:flex-start;justify-content:space-between;
  gap:24px;margin-bottom:28px;flex-wrap:wrap;
}
.page-header-left {flex:1;min-width:0}
.eyebrow {
  font-size:11px;font-weight:700;letter-spacing:.12em;
  text-transform:uppercase;color:var(--accent);margin-bottom:8px;
}
h1 {font-size:26px;font-weight:700;line-height:1.2;color:var(--text)}
.sub {font-size:13px;color:var(--text-mid);margin-top:6px}

/* ── Theme selector ─────────────────────────────────────── */
.theme-selector {
  display:flex;align-items:center;gap:10px;
  flex-shrink:0;padding-top:6px;
}
.theme-selector-label {
  font-size:10px;font-weight:700;letter-spacing:.08em;
  text-transform:uppercase;color:var(--muted);white-space:nowrap;
}
.theme-btns {display:flex;gap:5px;flex-wrap:wrap}
.theme-btn {
  font-family:var(--font);font-size:11px;font-weight:600;
  padding:5px 13px;border-radius:var(--r-pill);
  border:1px solid var(--border);background:var(--surface);
  color:var(--text-mid);cursor:pointer;transition:all .15s ease;
  white-space:nowrap;line-height:1.4;
}
.theme-btn:hover {
  border-color:var(--accent);color:var(--text);background:var(--raised);
}
.theme-btn.active {
  background:var(--accent);color:var(--bg);
  border-color:var(--accent);font-weight:700;
}

/* ── Summary cards ──────────────────────────────────────── */
.summary {
  display:grid;grid-template-columns:repeat(4,1fr);
  gap:12px;margin-bottom:28px;
}
.card {
  background:var(--surface);border:1px solid var(--border);
  border-radius:var(--r-lg);padding:16px 18px;box-shadow:var(--shadow);
}
.card-lbl {
  font-size:10px;font-weight:700;letter-spacing:.08em;
  text-transform:uppercase;color:var(--muted);margin-bottom:6px;
}
.card-val {
  font-size:20px;font-weight:500;font-family:var(--font);
  font-variant-numeric:tabular-nums;line-height:1.1;color:var(--text);
}
.card-sub {font-size:11px;color:var(--text-mid);margin-top:4px}

/* ── Market section ─────────────────────────────────────── */
.market-section {
  background:var(--surface);border:1px solid var(--border);
  border-radius:var(--r-lg);margin-bottom:16px;
  box-shadow:var(--shadow);overflow:hidden;
}

/* ── Market header ──────────────────────────────────────── */
.market-header {
  display:flex;align-items:center;gap:16px;padding:15px 20px;
  border-bottom:1px solid var(--border);
  background:linear-gradient(135deg,color-mix(in srgb,var(--accent) 7%,transparent) 0%,transparent 55%);
  cursor:pointer;user-select:none;transition:background .15s;
  flex-wrap:wrap;
}
.market-header:hover {
  background:linear-gradient(135deg,color-mix(in srgb,var(--accent) 12%,transparent) 0%,transparent 55%);
}
.market-header-left {flex:1;min-width:0}
.market-name {
  font-size:16px;font-weight:700;display:flex;align-items:center;
  gap:10px;color:var(--text);
}
.market-abbrev {
  display:inline-flex;align-items:center;justify-content:center;
  min-width:34px;height:24px;padding:0 8px;border-radius:var(--r-sm);
  background:var(--accent-soft);color:var(--accent);
  font-size:11px;font-weight:800;letter-spacing:.06em;font-family:var(--mono);
  border:1px solid color-mix(in srgb,var(--accent) 30%,transparent);
}
.market-meta {font-size:11px;color:var(--text-mid);margin-top:2px}

/* ── Market KPI strip ───────────────────────────────────── */
.market-kpi-strip {display:flex;gap:20px;align-items:center}
.mkpi {text-align:right}
.mkpi-val {
  font-size:15px;font-weight:500;font-family:var(--font);
  font-variant-numeric:tabular-nums;color:var(--text);line-height:1;
}
.mkpi-lbl {
  font-size:9px;font-weight:600;text-transform:uppercase;
  letter-spacing:.07em;color:var(--muted);margin-top:2px;
}

/* ── Collapse toggle ────────────────────────────────────── */
.market-toggle {
  display:flex;align-items:center;justify-content:center;
  width:28px;height:28px;border-radius:var(--r-md);
  border:1px solid var(--border);background:var(--raised);
  color:var(--muted);flex-shrink:0;transition:all .15s;
}
.market-header:hover .market-toggle {
  border-color:var(--accent);color:var(--accent);
}
.market-toggle svg {transition:transform .2s ease;transform:rotate(-90deg)}
.market-toggle.expanded svg {transform:rotate(0deg)}

/* ── SKU tile grid (collapsed state) ───────────────────── */
.sku-tiles-grid {
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(168px,1fr));
  gap:8px;padding:16px 20px 18px;
}
.sku-tile-type-label {
  grid-column:1/-1;font-size:10px;font-weight:700;
  letter-spacing:.09em;text-transform:uppercase;color:var(--muted);
  padding:6px 0 2px;
}
.sku-tile-type-label:first-child {padding-top:0}
.sku-tile {
  background:var(--raised);border:1px solid var(--border);
  border-left-width:4px;border-radius:var(--r-md);
  padding:10px 11px 11px;transition:opacity .15s;
}
.sku-tile:hover {opacity:.85}
.sku-tile-hd {
  display:flex;align-items:center;gap:6px;
  margin-bottom:9px;flex-wrap:wrap;
}
.sku-tile-name {font-size:11px;color:var(--text-mid);line-height:1.2}
.sku-tile-kpis {
  display:grid;grid-template-columns:repeat(2,1fr);gap:3px;
}
.kpi-mini {
  background:var(--surface);border:1px solid var(--border);
  border-radius:var(--r-sm);padding:5px 4px 4px;text-align:center;
}
.kpi-v {
  font-family:var(--font);font-size:12px;font-weight:500;
  font-variant-numeric:tabular-nums;color:var(--text);line-height:1.1;
}
.kpi-v.muted {color:var(--muted)}
.kpi-v.accent {color:var(--accent);font-weight:500}
.kpi-v.zero {color:var(--muted)}
.kpi-l {
  font-size:8px;font-weight:600;text-transform:uppercase;
  letter-spacing:.05em;color:var(--muted);margin-top:3px;line-height:1;
}

/* ── Detail body ────────────────────────────────────────── */
.section-body {padding:0 20px 24px}
.sub-label {
  font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;
  color:var(--muted);padding:18px 0 8px;
  display:flex;align-items:center;gap:8px;
}
.sub-label::after {
  content:'';flex:1;height:1px;
  background:var(--border);opacity:.6;
}

/* ── Tables ─────────────────────────────────────────────── */

<style>
  .section.primary { border-color:var(--accent); background:linear-gradient(180deg, var(--accent-soft) 0%, var(--surface) 35%); }

  /* === Wasabi-style nested SKU cards in the Packaging Pipeline === */
  /* Drop the inner table-card wrapper visuals so SKU cards sit directly in the
     section — but keep horizontal scrolling so wide tables stay contained. */
  .section.primary {
    overflow-x: clip; /* clip horizontally without affecting box-shadow */
  }
  .section.primary .tbl-wrap {
    border: none; background: transparent; border-radius: 0;
    overflow-x: auto;
    width: 100%; max-width: 100%;
    padding: 0;
  }
  .section.primary table.fr {
    border-collapse: separate;
    border-spacing: 0;
  }

     "stitched" together within one card. */
  .section.primary tbody.sku-block td {
    border-bottom: none;
    background: var(--surface);
  }
  /* Outer-edge borders form the card outline. Top + sides apply to the visible
     first row (always sku-summary) and to every cell column edge. Bottom-edge
     styling depends on which row is visually last given the collapse state. */
  .section.primary tbody.sku-block tr.sku-summary td { border-top: 1px solid var(--border); padding-top: 10px; }
  .section.primary tbody.sku-block td:first-child   { border-left: 1px solid var(--border); }
  .section.primary tbody.sku-block td:last-child    { border-right: 1px solid var(--border); }
  /* Top corners — always on the summary row */
  .section.primary tbody.sku-block tr.sku-summary td:first-child { border-top-left-radius: 10px; }
  .section.primary tbody.sku-block tr.sku-summary td:last-child  { border-top-right-radius: 10px; }

  /* Bottom edge — pick the visually-last row based on collapse state.
     COLLAPSED + has bottleneck row → bottleneck row is the card bottom. */
  .section.primary tbody.sku-block.collapsed tr.sku-bottleneck-row td {
    border-bottom: 1px solid var(--border); padding-bottom: 10px;
  }
  .section.primary tbody.sku-block.collapsed tr.sku-bottleneck-row td:first-child { border-bottom-left-radius: 10px; }
  .section.primary tbody.sku-block.collapsed tr.sku-bottleneck-row td:last-child  { border-bottom-right-radius: 10px; }

  /* COLLAPSED + no bottleneck row → summary is the card bottom. */
  .section.primary tbody.sku-block.collapsed:not(:has(tr.sku-bottleneck-row)) tr.sku-summary td {
    border-bottom: 1px solid var(--border); padding-bottom: 10px;
  }
  .section.primary tbody.sku-block.collapsed:not(:has(tr.sku-bottleneck-row)) tr.sku-summary td:first-child { border-bottom-left-radius: 10px; }

function methodLabel(m) {
  if (m==='ocean')    return 'Ocean Shipping';
  if (m==='air')      return 'Air Freight (1-2 wks)';
  if (m==='tf-batch') return 'Batch';
  return '';
}

function skuCategory(sku){ return sku.indexOf('DS')===0 ? 'DS' : 'D20'; }
function formatsFor(market, sku){ return (market.packFormats[skuCategory(sku)] || []); }
function flavorCodeOf(sku){ return sku.replace(/^DS|^D20/, ''); }
function flavorColorOf(sku){
  var entry = DATA.flavors[flavorCodeOf(sku)];
  return entry ? entry[1] : '#999';
}
// Bright flavor colors (Lime, Lemon) get dark text; everything else gets white.
function flavorTextColorOf(sku){
  var code = flavorCodeOf(sku);
  return (code === 'LI' || code === 'LE') ? '#1a1a1a' : '#ffffff';
}
function skuPillHTML(sku){
  return '<span class="sku" style="background:'+flavorColorOf(sku)+';color:'+flavorTextColorOf(sku)+';">'+sku+'</span>';
}

function buildPhases(market) {
  var phases = [{ key:'now', label:'NOW', shipsIncluded:[] }];
  market.shipments.forEach(function(s) {
    var prev = phases[phases.length-1].shipsIncluded.slice();
    prev.push(s.id);
    phases.push({ key: s.id, label: s.date, ship: s, shipsIncluded: prev });
  });
  return phases;
}

// Like buildPhases but coalesces consecutive shipments with the same Drops date
// into a single phase. Used by the Fulfillable table where the user cares about
// "what's shippable by date X" rather than per-PO granularity.
function buildMergedPhases(market) {
  var phases = [{ key:'now', label:'NOW', shipsIncluded:[] }];
  market.shipments.forEach(function(s) {
    var prev = phases[phases.length-1].shipsIncluded.slice();
    prev.push(s.id);
    var last = phases[phases.length-1];
    if (last.ship && last.ship.date === s.date) {
      // Same Drops date as previous — merge into existing column
      last.shipsIncluded = prev;
      last.ships = (last.ships || [last.ship]).concat([s]);
    } else {
      phases.push({ key: s.id, label: s.date, ship: s, ships: [s], shipsIncluded: prev });
    }
  });
  return phases;
}

function availableAt(market, component, sku, ships) {
  var v = (market.onSite[component] && market.onSite[component][sku]) || 0;
  ships.forEach(function(sid){
    var bucket = market.incoming[sid] && market.incoming[sid][component];
    if (bucket) v += (bucket[sku] || 0);
  });
  return v;
}
function packsAvailableAt(market, sku, formatId, ships) {
  var v = (market.onSite.packs && market.onSite.packs[sku] && market.onSite.packs[sku][formatId]) || 0;
  ships.forEach(function(sid){
    var bucket = market.incoming[sid] && market.incoming[sid].packs && market.incoming[sid].packs[sku];
    if (bucket) v += (bucket[formatId] || 0);
  });
  return v;
}
function sealsAt(market, ships) {
  var v = market.onSite.seals || 0;
  ships.forEach(function(sid){ v += (market.incoming[sid].seals || 0); });
  return v;
}
function totalTinsAt(market, ships) {
  var t = 0;
  market.skus.forEach(function(sku){ t += availableAt(market, 'tins', sku, ships); });
  return t;
}
function totalLabelsAt(market, ships) {
  var t = 0;
  market.skus.forEach(function(sku){ t += availableAt(market, 'labels', sku, ships); });
  return t;
}
function fulfillableUnitsAt(market, sku, ships) {
  return Math.min(availableAt(market,'tins',sku,ships), availableAt(market,'labels',sku,ships));
}
function fulfillablePacksAt(market, sku, fmtObj, ships) {
  var u = fulfillableUnitsAt(market, sku, ships);
  var packs = packsAvailableAt(market, sku, fmtObj.id, ships);
  return Math.min(Math.floor(u/fmtObj.size), packs);
}

// Identify the binding constraint(s) for max pack fulfillment of one SKU at
// a given phase. Returns array of objects: {label, qty} where qty is the shortage
// (units needed to clear that bottleneck). qty is null when undefined (both-zero case).
// Top-level helper: collapse format-specific masterpack labels into a generic
// "Masterpacks" label (Cartridge formats stay distinct). Used both inside the
// Packaging Pipeline render and in the market summary's action items.
function normalizeBottleneckLabel(label){
  if (/Masterpack/i.test(label)) return 'Masterpacks';
  if (/Cartridge/i.test(label))  return 'Cartridges';
  return label;
}

function bindingAt(market, sku, ships) {
  var t = availableAt(market, 'tins', sku, ships);
  var l = availableAt(market, 'labels', sku, ships);
  var items = [];
  if (t === 0 && l === 0) {
    return [{label:'Tins', qty:null}, {label:'Compliance Labels', qty:null}];
  }
  if (t < l) items.push({label:'Tins', qty: l - t});
  else if (l < t) items.push({label:'Compliance Labels', qty: t - l});
  var rem = remainingAfterPackaging(market, sku, ships);
  if (rem.tinsRemaining > 0) {
    formatsFor(market, sku).forEach(function(fmt){
      if ((rem.packsUnused[fmt.id] || 0) === 0) {
        items.push({label: fmt.label + 's', qty: Math.ceil(rem.tinsRemaining / fmt.size)});
      }
    });
  }
  return items;
}

// Compute what's left over after packaging this SKU's available tins into
// every pack format, filling the largest format first. Returns:
//   { tinsRemaining: <tins that won't fit in any masterpack>,
//     packsUnused:   { fmtId: <pack inventory left unused> } }
function remainingAfterPackaging(market, sku, ships) {
  var totalTins = fulfillableUnitsAt(market, sku, ships);
  var fmts = formatsFor(market, sku).slice().sort(function(a,b){return b.size - a.size;});
  var tinsLeft = totalTins;
  var packsUnused = {};
  fmts.forEach(function(fmt) {
    var inv = packsAvailableAt(market, sku, fmt.id, ships);
    var used = Math.min(Math.floor(tinsLeft / fmt.size), inv);
    tinsLeft -= used * fmt.size;
    packsUnused[fmt.id] = inv - used;
  });
  return { tinsRemaining: tinsLeft, packsUnused: packsUnused };
}

function shipHeaderHTML(s) {
  // Special-case TF warehouse transfer — no PO/vendor pill, just a tagline.
  if (s.status === 'transfer') {
    return '<div class="phase-hd"><span class="phase-date">Treeform Warehouse</span><span class="phase-po">transfer 1 wk.</span></div>';
  }
  // Compact header for non-primary tables. Drops PO + vendor + (optional) TF date.
  var pill = s.vendor === 'Global Print LA' ? 'gp' : 'tf';
  var dateLine = s.date;
  var subLine = s.po + ' &middot; <span class="vpill '+pill+'">'+s.vendor+'</span>';
  var tfLine = '';
  if (s.tfDate) tfLine = '<span class="phase-method">'+s.tfDate+'</span>';
  else if (s.method && s.method !== 'tbd' && s.method !== 'tf-batch') tfLine = '<span class="phase-method">'+methodLabel(s.method)+'</span>';
  return '<div class="phase-hd"><span class="phase-date">'+dateLine+'</span><span class="phase-po">'+subLine+'</span>'+tfLine+'</div>';
}

// Header for a merged group of shipments that share the same Drops date.
// Lists all POs underneath the date; surfaces shipping method if shared.
function mergedShipHeaderHTML(ships) {
  if (ships.length === 1) return shipHeaderHTML(ships[0]);
  var dateLine = ships[0].date;
  var poLines = ships.map(function(s){
    var pill = s.vendor === 'Global Print LA' ? 'gp' : 'tf';
    return '<span class="phase-po">'+s.po+' &middot; <span class="vpill '+pill+'">'+s.vendor+'</span></span>';
  }).join('');
  var method = ships[0].method;
  var allSame = method && ships.every(function(x){ return x.method === method; });
  var methodLine = '';
  if (allSame && (method === 'air' || method === 'ocean')) {
    methodLine = '<span class="phase-method">' + methodLabel(method) + '</span>';
  }
  return '<div class="phase-hd"><span class="phase-date">'+dateLine+'</span>'+poLines+methodLine+'</div>';
}

// Group a list of shipments by Drops date into sequential groups (preserves order).
function groupShipmentsByDate(shipments) {
  var groups = [];
  var lastDate = null;
  shipments.forEach(function(s){
    if (s.date === lastDate) {
      groups[groups.length-1].ships.push(s);
    } else {
      groups.push({ date: s.date, ships: [s] });
      lastDate = s.date;
    }
  });
  return groups;
}

// Used by primary Fulfillable table — Drops date + shipping method if known.
function fulfillHeaderHTML(p) {
  if (p.key==='now') return '<div class="phase-hd"><span class="phase-date">NOW</span></div>';
  var s = p.ship;
  if (s && s.status === 'transfer') {
    return '<div class="phase-hd"><span class="phase-date">Treeform Warehouse</span><span class="phase-po">transfer 1 wk.</span></div>';
  }
  // If all merged ships share a known shipping method (air/ocean), surface it.
  var ships = p.ships || [s];
  var method = ships[0] ? ships[0].method : null;
  var allSame = method && ships.every(function(x){ return x.method === method; });
  var methodLine = '';
  if (allSame && (method === 'air' || method === 'ocean')) {
    methodLine = '<span class="phase-method">' + methodLabel(method) + '</span>';
  }
  return '<div class="phase-hd"><span class="phase-date">'+s.date+'</span>'+methodLine+'</div>';
}
// Used by Tamper-Seal Balance — Drops PO + vendor (no TF PO).
function phaseHeaderHTML(p) {
  if (p.key==='now') return '<div class="phase-hd"><span class="phase-date">NOW</span><span class="phase-po">On site only</span></div>';
  var s = p.ship;
  var pill = s.vendor === 'Global Print LA' ? 'gp' : 'tf';
  var subLine = s.po + ' &middot; <span class="vpill '+pill+'">'+s.vendor+'</span>';
  var tfLine = '';
  if (s.tfDate) tfLine = '<span class="phase-method">'+s.tfDate+'</span>';
  else if (s.method && s.method !== 'tbd' && s.method !== 'tf-batch') tfLine = '<span class="phase-method">'+methodLabel(s.method)+'</span>';
  return '<div class="phase-hd"><span class="phase-date">+ '+s.date+'</span><span class="phase-po">'+subLine+'</span>'+tfLine+'</div>';
}

// Returns only shipments that actually contribute non-zero quantity to the given component.
// For tins / labels: any SKU > 0. For packs: any SKU × any format > 0.
function shipmentsForComponent(market, component) {
  return market.shipments.filter(function(s) {
    var bucket = market.incoming[s.id] && market.incoming[s.id][component];
    if (!bucket) return false;
    if (component === 'packs') {
      for (var sku in bucket) {
        if (!bucket[sku]) continue;
        for (var fmt in bucket[sku]) {
          if ((bucket[sku][fmt] || 0) > 0) return true;
        }
      }
      return false;
    } else {
      for (var sku2 in bucket) {
        if ((bucket[sku2] || 0) > 0) return true;
      }
      return false;
    }
  });
}

// Human-readable label for the empty-state callout
function componentLabel(component) {
  if (component === 'tins') return 'tin';
  if (component === 'labels') return 'compliance label';
  if (component === 'packs') return 'masterpack';
  return component;
}

// Build sections (groups of rows) for the inventory table.
// Sections are grouped by:
//   - pack format (when component === 'packs')
//   - variant (Old Art/New Art for tins, Old Warning/New Warning for labels)
//   - SKU category (DS/D20) otherwise
// Each section has a title (the divider label) and rows. Each row knows how to
// fetch its on-site value and how many units a given shipment contributes.
function buildInventorySections(market, component) {
  var sections = [];
  var skus = market.skus;

  if (component === 'packs') {
    // Format-first grouping. Each pack format applies to one category; only
    // SKUs of that category appear under it.
    ['DS','D20'].forEach(function(cat){
      (market.packFormats[cat] || []).forEach(function(fmtObj){
        var inCat = skus.filter(function(s){ return skuCategory(s) === cat; });
        if (!inCat.length) return;
        sections.push({
          title: fmtObj.label,
          rows: inCat.map(function(sku){
            return {
              labelHTML: skuPillHTML(sku),
              onSite: (market.onSite.packs && market.onSite.packs[sku] && market.onSite.packs[sku][fmtObj.id]) || 0,
              incoming: function(s){
                return (market.incoming[s.id] && market.incoming[s.id].packs && market.incoming[s.id].packs[sku] && market.incoming[s.id].packs[sku][fmtObj.id]) || 0;
              }
            };
          })
        });
      });
    });
    return sections;
  }

  if (component === 'tins' && market.onSite.tinsOldArt && market.onSite.tinsNewArt) {
    [['Old Art','tinsOldArt'],['New Art','tinsNewArt']].forEach(function(pair){
      var variant = pair[0], key = pair[1];
      sections.push({
        title: variant,
        rows: skus.map(function(sku){
          return {
            labelHTML: skuPillHTML(sku),
            onSite: (market.onSite[key] && market.onSite[key][sku]) || 0,
            // Incoming tins bucket to the New Art row by default.
            incoming: function(s){
              if (variant !== 'New Art') return 0;
              return (market.incoming[s.id] && market.incoming[s.id].tins && market.incoming[s.id].tins[sku]) || 0;
            }
          };
        })
      });
    });
    return sections;
  }

  if (component === 'labels' && market.onSite.labelsOldWarning && market.onSite.labelsNewWarning) {
    [['Old Warning','labelsOldWarning'],['New Warning','labelsNewWarning']].forEach(function(pair){
      var variant = pair[0], key = pair[1];
      sections.push({
        title: variant,
        rows: skus.map(function(sku){
          return {
            labelHTML: skuPillHTML(sku),
            onSite: (market.onSite[key] && market.onSite[key][sku]) || 0,
            incoming: function(s){
              if (variant !== 'New Warning') return 0;
              return (market.incoming[s.id] && market.incoming[s.id].labels && market.incoming[s.id].labels[sku]) || 0;
            }
          };
        })
      });
    });
    return sections;
  }

  // Default: DS / D20 category dividers, one row per SKU.
  ['DS','D20'].forEach(function(cat){
    var inCat = skus.filter(function(s){ return skuCategory(s) === cat; });
    if (!inCat.length) return;
    sections.push({
      title: cat==='DS' ? 'DS — Singles (50/case)' : 'D20 — 20-piece',
      rows: inCat.map(function(sku){
        return {
          labelHTML: skuPillHTML(sku),
          onSite: (market.onSite[component] && market.onSite[component][sku]) || 0,
          incoming: function(s){
            return (market.incoming[s.id] && market.incoming[s.id][component] && market.incoming[s.id][component][sku]) || 0;
          }
        };
      })
    });
  });
  return sections;
}

function renderInventoryTable(market, component) {
  if (!market.skus.length) return null;
  var sections = buildInventorySections(market, component);
  if (!sections.length) return null;

  var relevantShipments = shipmentsForComponent(market, component);
  var hasShipments = relevantShipments.length > 0;
  var groups = hasShipments ? groupShipmentsByDate(relevantShipments) : [];
  // SKU + On Site + per-group shipment cols + Total
  var totalCols = 3 + groups.length;

  var wrap = el('div',{class: hasShipments ? 'tbl-wrap' : 'tbl-wrap empty-callout'});
  if (!hasShipments) {
    wrap.appendChild(el('div',{class:'empty-msg'},
      'No upcoming '+componentLabel(component)+' orders for '+market.name+'. '
      +'Showing on-site inventory only.'));
  }

  var t = el('table',{class:'fr'});
  var thead = el('thead'), hr = el('tr');
  hr.appendChild(el('th',null,''));
  hr.appendChild(el('th',{class:'num'},'On Site'));
  groups.forEach(function(g){
    hr.appendChild(el('th',{class:'num'}, mergedShipHeaderHTML(g.ships)));
  });
  hr.appendChild(el('th',{class:'num total-col'}, 'Total'));
  thead.appendChild(hr); t.appendChild(thead);

  var tbody = el('tbody');
  sections.forEach(function(sec){
    var div = el('tr',{class:'type-divider'});
    div.appendChild(el('td',{colspan:String(totalCols)}, sec.title));
    tbody.appendChild(div);
    sec.rows.forEach(function(rd){
      // Pre-compute incoming per group so we know the row total before we
      // build the row element (and can flag the whole row when total === 0).
      var perGroup = groups.map(function(g){
        var v = 0;
        g.ships.forEach(function(s){ v += rd.incoming(s); });
        return v;
      });
      var rowTotal = rd.onSite + perGroup.reduce(function(a,b){return a+b;}, 0);
      var row = el('tr', rowTotal === 0 ? {class:'zero-row'} : null);
      row.appendChild(el('td', null, rd.labelHTML));
      row.appendChild(el('td',{class:'num'+(rd.onSite===0?' muted-cell':'')}, fmt(rd.onSite)));
      perGroup.forEach(function(v){
        row.appendChild(el('td',{class:'num'+(v===0?' muted-cell':'')}, fmt(v)));
      });
      row.appendChild(el('td',{class:'num total-col'+(rowTotal===0?' muted-cell':'')}, fmt(rowTotal)));
      tbody.appendChild(row);
    });
  });
  t.appendChild(tbody); wrap.appendChild(t);
  return wrap;
}

function renderSealsRow(market) {
  if (!market.requiresSeals) return null;
  var wrap = el('div',{class:'tbl-wrap'});
  var t = el('table',{class:'fr'});
  var thead = el('thead'), hr = el('tr');
  hr.appendChild(el('th',null,'Component'));
  hr.appendChild(el('th',{class:'num'},'On Site'));
  market.shipments.forEach(function(s){
    hr.appendChild(el('th',{class:'num'}, shipHeaderHTML(s)));
  });
  thead.appendChild(hr); t.appendChild(thead);
  var tbody = el('tbody'); var row = el('tr');
  row.appendChild(el('td',null,'Tamper-Evident Seals <span class="flavor">(market pool)</span>'));
  var os = market.onSite.seals||0;
  row.appendChild(el('td',{class:'num'+(os===0?' muted-cell':'')},fmt(os)));
  market.shipments.forEach(function(s){
    var v = (market.incoming[s.id]&&market.incoming[s.id].seals)||0;
    row.appendChild(el('td',{class:'num'+(v===0?' muted-cell':'')},fmt(v)));
  });
  tbody.appendChild(row); t.appendChild(tbody); wrap.appendChild(t);
  return wrap;
}

// Combined primary Fulfillable table: per SKU shows 1 row of fulfillable units (tins)
// plus 1 row per pack format with fulfillable pack count. Headers are Drops dates only.
function renderFulfillable(market) {
  var allPhases = buildMergedPhases(market);
  // End-of-plan ship list — every shipment rolled up. Used by Remaining /
  // Bottleneck / Units Needed columns regardless of which phases are hidden.
  var endShips = allPhases.length ? allPhases[allPhases.length-1].shipsIncluded : [];

  // Hide phase columns that don't move anything. NOW is always shown so the
  // user can see the on-site baseline. A later phase is shown only if some
  // SKU's units or any pack format would show a non-zero increment there.
  var phaseHasData = allPhases.map(function(_, i){ return i === 0; });
  market.skus.forEach(function(sku){
    var prevCumU = 0;
    allPhases.forEach(function(p,i){
      var cum = fulfillableUnitsAt(market,sku,p.shipsIncluded);
      var inc = (i === 0) ? cum : (cum - prevCumU);
      if (i > 0 && inc !== 0) phaseHasData[i] = true;
      prevCumU = cum;
    });
    formatsFor(market, sku).forEach(function(fmtObj){
      var prevCumP = 0;
      allPhases.forEach(function(p,i){
        var cum = fulfillablePacksAt(market, sku, fmtObj, p.shipsIncluded);
        var inc = (i === 0) ? cum : (cum - prevCumP);
        if (i > 0 && inc !== 0) phaseHasData[i] = true;
        prevCumP = cum;
      });
    });
  });
  var phases = allPhases.filter(function(_,i){ return phaseHasData[i]; });

  var wrap = el('div',{class:'tbl-wrap'});
  var t = el('table',{class:'fr'});
  var thead = el('thead'), hr = el('tr');
  hr.appendChild(el('th',null,''));
  hr.appendChild(el('th',null,''));
  phases.forEach(function(p){ hr.appendChild(el('th',{class:'num'}, fulfillHeaderHTML(p))); });
  hr.appendChild(el('th',{class:'num remain-col'}, '<div class="phase-hd"><span class="phase-date">Remaining</span><span class="phase-po">After packaging</span></div>'));
  hr.appendChild(el('th',{class:'needed-col'}, '<div class="phase-hd"><span class="phase-date">Units Needed</span><span class="phase-po">To balance</span></div>'));
  thead.appendChild(hr); t.appendChild(thead);

  // Helper: render a combined "needed" cell from a list of {label, qty} items.
  function buildNeededCellHTML(items){
    if (!items || !items.length) return '<span class="muted-cell">&mdash;</span>';
    return items.map(function(it){
      return '<div class="need-line"><span class="need-label">'+it.label+':</span> <span class="need-qty">'+fmt(it.qty)+'</span></div>';
    }).join('');
  }
  // Helper: render bottleneck items {label, qty} as visually-distinct pills.
  // After normalization (e.g. multiple masterpack formats collapse into one
  // "Masterpacks" pill), the smaller qty wins — that's the minimum quantity
  // needed to clear the bottleneck using the most efficient available format.
  function pillifyBottlenecks(items){
    if (!items || !items.length) return '<span class="muted-cell">&mdash;</span>';
    var unique = [];
    items.forEach(function(it){
      var n = normalizeBottleneckLabel(it.label);
      var existing = null;
      for (var j = 0; j < unique.length; j++) {
        if (unique[j].label === n) { existing = unique[j]; break; }
      }
      if (!existing) {
        unique.push({label:n, qty: it.qty});
      } else if (it.qty != null) {
        if (existing.qty == null || it.qty < existing.qty) existing.qty = it.qty;
      }
    });
    return unique.map(function(it){
      var qtyText = (it.qty == null) ? '' : '&minus;' + fmt(it.qty) + ' ';
      return '<span class="bn-pill">'+qtyText+it.label+'</span>';
    }).join(' ');
  }

  var lastCat = null;
  var unitTotals = phases.map(function(){return 0;});
  var totalRemainingUnits = 0;
  var colCount = 4 + phases.length;

  market.skus.forEach(function(sku){
    var cat = skuCategory(sku);
    if (cat !== lastCat) {
      var divTbody = el('tbody');
      var d = el('tr',{class:'type-divider'});
      d.appendChild(el('td',{colspan:String(colCount)}, cat==='DS' ? 'DS &mdash; Singles (2-piece tins)' : 'D20 &mdash; 20-piece tins'));
      divTbody.appendChild(d);
      t.appendChild(divTbody);
      lastCat = cat;
    }

    // Compute end-of-plan packaging residual + bottleneck flags + units-needed.
    var packResidual = remainingAfterPackaging(market, sku, endShips);
    totalRemainingUnits += packResidual.tinsRemaining;
    var endTins = availableAt(market,'tins',sku,endShips);
    var endLabels = availableAt(market,'labels',sku,endShips);
    var unitFlags = [];
    var unitNeeded;
    if (endTins === 0 && endLabels === 0) {
      unitFlags.push('Tins'); unitFlags.push('Compliance Labels');
      unitNeeded = null;
    } else if (endTins < endLabels) {
      unitFlags.push('Tins'); unitNeeded = endLabels - endTins;
    } else if (endLabels < endTins) {
      unitFlags.push('Compliance Labels'); unitNeeded = endTins - endLabels;
    } else {
      unitNeeded = 0;
    }
    var fmts = formatsFor(market, sku);
    // Combined flags (unit-level + each pack format that's exhausted).
    var allFlags = unitFlags.slice();
    fmts.forEach(function(fmtObj){
      var unused = packResidual.packsUnused[fmtObj.id] || 0;
      if (unused === 0 && packResidual.tinsRemaining > 0) {
        allFlags.push(fmtObj.label + 's');
      }
    });

    // One <tbody> per SKU so the detail rows can be collapsed independently.
    var skuTbody = el('tbody',{class:'sku-block collapsed','data-sku':sku});

    // === SUMMARY ROW (always visible) ===
    var sumRow = el('tr',{class:'sku-summary'});
    var pillCell = el('td',{class:'sku-toggle'},
      '<span class="chevron"></span>' + skuPillHTML(sku));
    sumRow.appendChild(pillCell);
    sumRow.appendChild(el('td',{class:'fmt-label'},'Masterpacks fulfillable'));
    // Per-phase incremental total packs (summed across formats). Per-phase
    // mid-stream bottlenecks are surfaced on a separate sub-row below this one.
    var endBn = bindingAt(market, sku, endShips);
    var endBnLabels = endBn.map(function(it){return it.label;});
    var MASTERPACK_PAR = 100; // only flag mid-stream when cumulative packs < par
    var prevPacksCum = 0;
    var perPhaseMidStream = [];
    phases.forEach(function(p,i){
      var cum = 0;
      fmts.forEach(function(fmtObj){
        cum += fulfillablePacksAt(market, sku, fmtObj, p.shipsIncluded);
      });
      var inc = (i === 0) ? cum : (cum - prevPacksCum);
      var display, cls;
      if (i === 0)          { display = fmt(inc); cls = 'num'; }
      else if (inc === 0)   { display = '&mdash;'; cls = 'num repeat-cell'; }
      else                  { display = fmt(inc); cls = 'num'; }
      sumRow.appendChild(el('td',{class:cls}, display));
      prevPacksCum = cum;
      // Track per-phase mid-stream bottleneck for the optional sub-row.
      // Only flag when (a) the binding constraint at this phase differs from
      // end-of-plan, AND (b) cumulative masterpacks fulfillable is below the par.
      var phaseBn = bindingAt(market, sku, p.shipsIncluded);
      var midStream = phaseBn.filter(function(b){ return endBnLabels.indexOf(b.label) === -1; });
      if (cum >= MASTERPACK_PAR) midStream = [];
      perPhaseMidStream.push(midStream);
    });
    // Build the combined "Units Needed" cell for the summary row: pull together
    // every kind of bottleneck (unit-level + each exhausted pack format).
    var sumNeededItems = [];
    if (endTins === 0 && endLabels === 0) {
      // Both zero — qty undefined; skip numeric needs.
    } else if (endTins < endLabels) {
      sumNeededItems.push({label:'Tins', qty: endLabels - endTins});
    } else if (endLabels < endTins) {
      sumNeededItems.push({label:'Compliance Labels', qty: endTins - endLabels});
    }
    fmts.forEach(function(fmtObj){
      var unused = packResidual.packsUnused[fmtObj.id] || 0;
      if (unused === 0 && packResidual.tinsRemaining > 0) {
        sumNeededItems.push({label: fmtObj.label + 's', qty: Math.ceil(packResidual.tinsRemaining / fmtObj.size)});
      }
    });
    sumRow.appendChild(el('td',{class:'num remain-col'+(packResidual.tinsRemaining===0?' muted-cell':'')}, fmt(packResidual.tinsRemaining)));
    sumRow.appendChild(el('td',{class:'needed-col'}, buildNeededCellHTML(sumNeededItems)));
    skuTbody.appendChild(sumRow);

    // === Optional Bottlenecks sub-row (only when any phase has mid-stream issues) ===
    var hasAnyMidStream = perPhaseMidStream.some(function(arr){ return arr.length > 0; });
    if (hasAnyMidStream) {
      var bnRow = el('tr',{class:'sku-bottleneck-row'});
      bnRow.appendChild(el('td',null,''));
      bnRow.appendChild(el('td',{class:'fmt-label'},'BOTTLENECKS'));
      perPhaseMidStream.forEach(function(midList){
        bnRow.appendChild(el('td',{class:'midstream-cell'}, pillifyBottlenecks(midList)));
      });
      bnRow.appendChild(el('td',{class:'remain-col'},''));
      bnRow.appendChild(el('td',{class:'needed-col'},''));
      skuTbody.appendChild(bnRow);
    }

    // === DETAIL: Tins + Compliance Label row ===
    var unitRow = el('tr',{class:'sku-detail fu-unit-row'});
    unitRow.appendChild(el('td',null,''));
    unitRow.appendChild(el('td',{class:'fmt-label'},'Tins + Compliance Label'));
    var prevCumU = 0;
    phases.forEach(function(p,i){
      var cum = fulfillableUnitsAt(market,sku,p.shipsIncluded);
      var inc = (i === 0) ? cum : (cum - prevCumU);
      unitTotals[i] += inc;
      var display, cls;
      if (i === 0)        { display = fmt(inc); cls = 'num'; }
      else if (inc === 0) { display = '&mdash;'; cls = 'num repeat-cell'; }
      else                { display = fmt(inc); cls = 'num'; }
      unitRow.appendChild(el('td',{class:cls}, display));
      prevCumU = cum;
    });
    unitRow.appendChild(el('td',{class:'num remain-col'+(packResidual.tinsRemaining===0?' muted-cell':'')}, fmt(packResidual.tinsRemaining)));
    var unitNeededItems = [];
    if (endTins === 0 && endLabels === 0) {
      // qty undefined
    } else if (endTins < endLabels) {
      unitNeededItems.push({label:'Tins', qty: endLabels - endTins});
    } else if (endLabels < endTins) {
      unitNeededItems.push({label:'Compliance Labels', qty: endTins - endLabels});
    }
    unitRow.appendChild(el('td',{class:'needed-col'}, buildNeededCellHTML(unitNeededItems)));
    skuTbody.appendChild(unitRow);

    // === DETAIL: pack format rows ===
    fmts.forEach(function(fmtObj){
      var row = el('tr',{class:'sku-detail fu-pack-row'});
      row.appendChild(el('td',null,''));
      row.appendChild(el('td',{class:'fmt-label'},fmtObj.label));
      var prevCumP = 0;
      phases.forEach(function(p,i){
        var cum = fulfillablePacksAt(market, sku, fmtObj, p.shipsIncluded);
        var inc = (i === 0) ? cum : (cum - prevCumP);
        var display, cls;
        if (i === 0)        { display = fmt(inc); cls = 'num'; }
        else if (inc === 0) { display = '&mdash;'; cls = 'num repeat-cell'; }
        else                { display = fmt(inc); cls = 'num'; }
        row.appendChild(el('td',{class:cls}, display));
        prevCumP = cum;
      });
      var unused = packResidual.packsUnused[fmtObj.id] || 0;
      row.appendChild(el('td',{class:'num remain-col'+(unused===0?' muted-cell':'')}, fmt(unused)));
      var packNeededItems = [];
      if (unused === 0 && packResidual.tinsRemaining > 0) {
        packNeededItems.push({label: fmtObj.label + 's', qty: Math.ceil(packResidual.tinsRemaining / fmtObj.size)});
      }
      row.appendChild(el('td',{class:'needed-col'}, buildNeededCellHTML(packNeededItems)));
      skuTbody.appendChild(row);
    });

    t.appendChild(skuTbody);
    // Vertical breathing room between adjacent SKU cards
    var spacer = el('tbody',{class:'sku-spacer'});
    var sp = el('tr');
    sp.appendChild(el('td',{colspan:String(colCount)},'&nbsp;'));
    spacer.appendChild(sp);
    t.appendChild(spacer);
  });

  // === TOTAL row ===
  var totalTbody = el('tbody');
  var tr = el('tr',{class:'totalrow'});
  tr.appendChild(el('td',null,'TOTAL UNITS'));
  tr.appendChild(el('td',null,''));
  unitTotals.forEach(function(v, i){
    var display, cls;
    if (i === 0)      { display = fmt(v); cls = 'num'; }
    else if (v === 0) { display = '&mdash;'; cls = 'num repeat-cell'; }
    else              { display = fmt(v); cls = 'num'; }
    tr.appendChild(el('td',{class:cls}, display));
  });
  tr.appendChild(el('td',{class:'num remain-col'}, fmt(totalRemainingUnits)));
  tr.appendChild(el('td',{class:'needed-col'}, ''));
  totalTbody.appendChild(tr);
  t.appendChild(totalTbody);

  wrap.appendChild(t);
  return wrap;
}

function renderSealBalance(market) {
  if (!market.requiresSeals) return null;
  // Build phases from only the shipments that actually affect this table —
  // i.e. POs that add tins or tamper seals. Masterpack-only POs (which add
  // neither) are skipped so they don't produce no-op rows.
  var relevant = market.shipments.filter(function(s){
    var inc = market.incoming[s.id] || {};
    if ((inc.seals || 0) > 0) return true;
    var tins = inc.tins || {};
    for (var sku in tins) { if ((tins[sku] || 0) > 0) return true; }
    return false;
  });
  var marketForPhases = Object.assign({}, market, { shipments: relevant });
  // Use merged phases (one row per Drops date) so consecutive same-date shipments
  // collapse into a single line listing all POs.
  var phases = buildMergedPhases(marketForPhases);
  var sec = el('div',{class:'section'});
  sec.appendChild(el('h3',null,'Tamper-Seal Balance'));
  sec.appendChild(el('div',{class:'section-sub'},'Total tins vs tamper-seal pool at each phase. Negative value = seal shortage.'));
  var wrap = el('div',{class:'tbl-wrap'});
  var t = el('table',{class:'fr'});
  var thead = el('thead'), hr = el('tr');
  hr.appendChild(el('th',null,'Phase'));
  hr.appendChild(el('th',{class:'num'},'Total Tins'));
  hr.appendChild(el('th',{class:'num'},'Tamper Seals'));
  hr.appendChild(el('th',{class:'num'},'Remaining After Packaging'));
  thead.appendChild(hr); t.appendChild(thead);
  var tbody = el('tbody');
  phases.forEach(function(p){
    var tins = totalTinsAt(market,p.shipsIncluded);
    var seals = sealsAt(market,p.shipsIncluded);
    var delta = seals - tins;
    var label;
    if (p.key === 'now') {
      label = 'NOW';
    } else {
      var ships = p.ships || (p.ship ? [p.ship] : []);
      if (ships.length && ships[0].status === 'transfer') {
        label = '+ Treeform Warehouse';
      } else {
        var poList = ships.map(function(s){return s.po;}).join(' + ');
        label = '+ '+p.label+' &middot; '+poList;
      }
    }
    var row = el('tr',{class: delta<0?'delta-neg':''});
    row.appendChild(el('td',null,label));
    row.appendChild(el('td',{class:'num'},fmt(tins)));
    row.appendChild(el('td',{class:'num'},fmt(seals)));
    row.appendChild(el('td',{class:'num'},(delta>=0?'+':'')+fmt(delta)));
    tbody.appendChild(row);
  });
  t.appendChild(tbody); wrap.appendChild(t); sec.appendChild(wrap);
  return sec;
}

// 2–3 sentence narrative summarizing the market's Packaging Pipeline in plain
// English. Covers: on-site state now, key incoming shipments + dates + POs,
// what will be fulfillable after everything lands, and where the constraints are.
function summarizeMarket(m) {
  var onSiteTins = 0, nowFulfillable = 0, endFulfillable = 0;
  var allShips = m.shipments.map(function(s){return s.id;});
  m.skus.forEach(function(sku){
    onSiteTins     += (m.onSite.tins && m.onSite.tins[sku]) || 0;
    nowFulfillable += fulfillableUnitsAt(m, sku, []);
    endFulfillable += fulfillableUnitsAt(m, sku, allShips);
  });
  // Per-SKU bottleneck counts at end of plan
  var tinB = 0, labB = 0, bothB = 0, balanced = 0;
  m.skus.forEach(function(sku){
    var t = availableAt(m,'tins',sku,allShips);
    var l = availableAt(m,'labels',sku,allShips);
    if (t === 0 && l === 0) bothB++;
    else if (t < l) tinB++;
    else if (l < t) labB++;
    else balanced++;
  });
  // Find TF transfer + non-transfer shipments
  var tf = null, real = [];
  m.shipments.forEach(function(s){
    if (s.status === 'transfer') tf = s; else real.push(s);
  });
  // Helper: strip "PO-" and leading zeros so "PO-0000774" reads as "PO 774"
  function poShort(po){
    if (!po) return po;
    var n = po.replace(/^PO-?0*/i, '');
    return n ? ('PO ' + n) : po;
  }

  // === Sentence 1: state now ===
  var s1;
  if (onSiteTins === 0) {
    s1 = m.name + ' has no on-site tin inventory.';
  } else {
    s1 = m.name + ' has ' + fmt(onSiteTins) + ' tins on-site';
    if (nowFulfillable > 0 && nowFulfillable < onSiteTins) {
      s1 += ' (' + fmt(nowFulfillable) + ' fulfillable right now)';
    }
    s1 += '.';
  }

  // === Sentence 2: structured shipment lines ===
  function cleanDate(d){ return d.replace(/^Drops\s+/, ''); }
  // TF Warehouse pool (if any)
  var tfLine = null;
  if (tf) {
    var transferTins = 0;
    m.skus.forEach(function(sku){
      transferTins += (m.incoming[tf.id] && m.incoming[tf.id].tins && m.incoming[tf.id].tins[sku]) || 0;
    });
    tfLine = { quantity: transferTins, type: 'tins' };
  }
  // Group real shipments by date and tally components
  var dateGroups = [];
  var lastDateSeen = null;
  real.forEach(function(s){
    if (s.date !== lastDateSeen) {
      dateGroups.push({ date: s.date, ships: [s] });
      lastDateSeen = s.date;
    } else {
      dateGroups[dateGroups.length-1].ships.push(s);
    }
  });
  var shipmentLines = dateGroups.map(function(g){
    var tins = 0, labels = 0, packs = 0;
    g.ships.forEach(function(s){
      var inc = m.incoming[s.id] || {};
      m.skus.forEach(function(sku){
        tins += ((inc.tins||{})[sku]||0);
        labels += ((inc.labels||{})[sku]||0);
        var bySku = (inc.packs||{})[sku] || {};
        for (var fid in bySku) packs += bySku[fid];
      });
    });
    // Identify the dominant component for this date
    var components = [];
    if (tins > 0)   components.push({ type:'tins',        qty: tins });
    if (labels > 0) components.push({ type:'compliance labels', qty: labels });
    if (packs > 0)  components.push({ type:'masterpacks', qty: packs });
    // Determine method (single or mixed)
    var firstMethod = g.ships[0].method;
    var sameMethod = g.ships.every(function(s){return s.method === firstMethod;});
    var methodLabel = '';
    if (sameMethod) {
      if (firstMethod === 'air')      methodLabel = 'Air Freight';
      else if (firstMethod === 'ocean') methodLabel = 'Ocean Shipping';
    }
    // PO list
    var poSet = {};
    g.ships.forEach(function(s){ if (s.po && s.po !== 'TF Transfer') poSet[s.po] = true; });
    var pos = Object.keys(poSet).map(poShort);
    return {
      date: cleanDate(g.date),
      method: methodLabel,
      components: components,
      pos: pos
    };
  });

  // Masterpack-limited count: any SKU whose tins-can't-fit-in-packs > 0 at end of plan.
  var mpLimited = 0;
  m.skus.forEach(function(sku){
    var rem = remainingAfterPackaging(m, sku, allShips);
    if (rem.tinsRemaining > 0) mpLimited++;
  });
  // === Action items: aggregated end-of-plan shortages with need-by dates ===
  // Logic: a shortage of item X needs to be ordered by the date of the LAST
  // scheduled shipment that brings X. If nothing ever brings X, the shortage
  // is real now and ASAP. Pending/TBD phases are skipped (unknown dates).
  var phases = buildMergedPhases(m);
  function shipBringsItem(s, label) {
    var inc = m.incoming[s.id] || {};
    if (label === 'Tins') {
      var t = inc.tins || {};
      for (var k in t) if ((t[k]||0) > 0) return true;
      return false;
    }
    if (label === 'Compliance Labels') {
      var l = inc.labels || {};
      for (var k2 in l) if ((l[k2]||0) > 0) return true;
      return false;
    }
    var rxMP = /^mp/i, rxCart = /^cart/i;
    var rx = (label === 'Cartridges') ? rxCart : rxMP;
    var packs = inc.packs || {};
    for (var sku2 in packs) {
      var bySku = packs[sku2] || {};
      for (var fid in bySku) if (rx.test(fid) && (bySku[fid]||0) > 0) return true;
    }
    return false;
  }
  function formatDateFromSort(sortDate) {
    var d = new Date(sortDate + 'T00:00:00');
    if (isNaN(d.getTime())) return sortDate;
    return d.toLocaleDateString('en-US', {month:'short', day:'numeric', year:'numeric'});
  }
  function lastShipmentDateForItem(label) {
    for (var i = phases.length - 1; i >= 1; i--) {
      var p = phases[i];
      var ships = p.ships || (p.ship ? [p.ship] : []);
      for (var j = 0; j < ships.length; j++) {
        var s = ships[j];
        if (!s || !s.date) continue;
        if (/Pending|TBD/i.test(s.date)) continue; // unknown
        if (shipBringsItem(s, label)) {
          if (s.status === 'transfer' && s.sortDate) return formatDateFromSort(s.sortDate);
          return cleanDate(s.date);
        }
      }
    }
    return null; // nothing scheduled — ASAP
  }
  // Aggregate end-of-plan shortages per item type + count affected SKUs.
  var actionMap = {};
  m.skus.forEach(function(sku){
    var endBn = bindingAt(m, sku, allShips);
    endBn.forEach(function(b){
      var lab = normalizeBottleneckLabel(b.label);
      if (!actionMap[lab]) actionMap[lab] = { label: lab, totalQty: 0, skus: {} };
      if (b.qty != null) actionMap[lab].totalQty += b.qty;
      actionMap[lab].skus[sku] = true;
    });
  });
  function whyString(label, affectedCount, hasIncoming) {
    var noun;
    if (label === 'Tins') noun = 'tins';
    else if (label === 'Compliance Labels') noun = 'compliance labels';
    else if (label === 'Masterpacks') noun = 'masterpacks';
    else if (label === 'Cartridges') noun = 'cartridges';
    else noun = label.toLowerCase();
    var skuCt = affectedCount + ' SKU' + (affectedCount !== 1 ? 's' : '');
    if (hasIncoming) return skuCt + ' short on ' + noun + ' after final scheduled delivery';
    return skuCt + ' short on ' + noun + '; none incoming';
  }
  var actionItems = Object.keys(actionMap)
    .map(function(key){
      var it = actionMap[key];
      var hasIncoming = lastShipmentDateForItem(it.label) !== null;
      var affected = Object.keys(it.skus).length;
      return {
        label: it.label,
        qty: it.totalQty,
        why: whyString(it.label, affected, hasIncoming),
        urgent: !hasIncoming
      };
    })
    .filter(function(it){ return it.qty > 0; })
    .sort(function(a, b){
      if (a.urgent !== b.urgent) return a.urgent ? -1 : 1;
      return b.qty - a.qty;
    });

  // Return prose (sentence 1) + structured shipment data + KPIs + action items.
  return {
    text: s1,
    tfLine: tfLine,
    shipmentLines: shipmentLines,
    actionItems: actionItems,
    kpis: {
      totalFulfillable: endFulfillable,
      totalSkus: tinB + labB + bothB + balanced,
      tinLimited: tinB,
      labelLimited: labB,
      missingBoth: bothB,
      masterpackLimited: mpLimited
    }
  };
}

function renderMarketPage(key) {
  var m = DATA.markets[key];
  var page = el('section',{class:'market-page',id:'mkt-'+key});
  if (key !== 'NY') page.setAttribute('hidden','');
  page.appendChild(el('h2',null,m.name));

  // Quick narrative summary + per-date shipment breakdown + KPI tiles
  var summary = summarizeMarket(m);
  var summaryBox = el('div',{class:'market-summary'});
  // === Needs Action: units needed by item type, with reason ===
  if (summary.actionItems && summary.actionItems.length > 0) {
    var actWrap = el('div',{class:'action-items-wrap'});
    actWrap.appendChild(el('div',{class:'action-items-section-title'}, 'NEEDS ACTION'));
    var actTable = el('table',{class:'action-items'});

  // Helper: render a shipment line "[date] · [method] · qty type · POs"
  function renderShipmentLine(opts){

        var qtyEl = el('span',{class:'sl-qty'}, fmt(c.qty) + ' ' + c.type);
        line.appendChild(qtyEl);
      });
    }
    if (opts.pos && opts.pos.length) {
      line.appendChild(el('span',{class:'sl-pos'}, opts.pos.join(', ')));
    }
    return line;
  }
  if (summary.tfLine || summary.shipmentLines.length) {
    var slWrap = el('div',{class:'shipment-list'});
    if (summary.tfLine) {
      slWrap.appendChild(renderShipmentLine({
        date: 'Treeform Warehouse',
        method: '1-week lead time',
        components: [{type:'tins', qty: summary.tfLine.quantity}],
        pos: [],
        tf: true
      }));
    }
    summary.shipmentLines.forEach(function(l){
      slWrap.appendChild(renderShipmentLine(l));
    });
    summaryBox.appendChild(slWrap);
  }
  var tiles = el('div',{class:'kpi-tiles'});
  function addTile(label, value, suffix, variant){
    var tile = el('div',{class:'kpi-tile'+(variant?' '+variant:'')});
    tile.appendChild(el('div',{class:'kpi-label'}, label));
    var valHTML = '<span class="kpi-value">'+fmt(value)+'</span>';
    if (suffix) valHTML += ' <span class="kpi-suffix">'+suffix+'</span>';
    tile.appendChild(el('div',{class:'kpi-value-row'}, valHTML));
    tiles.appendChild(tile);
  }
  addTile('Fulfillable Units', summary.kpis.totalFulfillable, '', summary.kpis.totalFulfillable === 0 ? 'kpi-zero' : 'kpi-primary');
  if (summary.kpis.tinLimited > 0)         addTile('Tin-Limited SKUs',          summary.kpis.tinLimited,         'of '+summary.kpis.totalSkus, 'kpi-warn');
  if (summary.kpis.labelLimited > 0)       addTile('Label-Limited SKUs',        summary.kpis.labelLimited,       'of '+summary.kpis.totalSkus, 'kpi-warn');
  if (summary.kpis.masterpackLimited > 0)  addTile('Masterpack-Limited SKUs',   summary.kpis.masterpackLimited,  'of '+summary.kpis.totalSkus, 'kpi-warn');
  if (summary.kpis.missingBoth > 0)        addTile('Missing Components',        summary.kpis.missingBoth,        'of '+summary.kpis.totalSkus, 'kpi-warn');
  summaryBox.appendChild(tiles);
  page.appendChild(summaryBox);

  // 1. PRIMARY: Fulfillable table — units + packs per SKU
  var fu = el('div',{class:'section primary'});
  fu.appendChild(el('h3',null,'Packaging Pipeline'));
  fu.appendChild(el('div',{class:'section-sub'},'What can be fulfilled. Low stock items preventing fulfillment noted as Bottlenecks.'));
  fu.appendChild(renderFulfillable(m));
  page.appendChild(fu);

  // 2. Compliance-label balance (market-level)
  var labelBal = renderLabelBalance(m); if (labelBal) page.appendChild(labelBal);

  // 3. Tamper-seal balance (market-level, only for seal-required markets)
  var seal = renderSealBalance(m); if (seal) page.appendChild(seal);

  // 4. Components Inventory — the input layer
  var inv = el('div',{class:'section'});
  inv.appendChild(el('h3',null,'Components Inventory'));
  inv.appendChild(el('div',{class:'section-sub'},'On-site stock plus what each incoming shipment adds.'));
  function addSub(title, node) { if (!node) return; var sb = el('div',{class:'sub-block'}); sb.appendChild(el('h4',null,title)); sb.appendChild(node); inv.appendChild(sb); }
  addSub('Tins',               renderInventoryTable(m, 'tins'));
  addSub('Compliance Labels',  renderInventoryTable(m, 'labels'));
  addSub('Packs (Masterpacks / Cartridges)', renderInventoryTable(m, 'packs'));
  if (m.requiresSeals) addSub('Tamper Seals', renderSealsRow(m));
  page.appendChild(inv);

  return page;
}

function renderTabs() {
  var nav = document.getElementById('market-tabs');
  nav.innerHTML = '';
  Object.keys(DATA.markets).forEach(function(key,i){
    var btn = el('button',{'data-market':key}, key);
    if (i===0) btn.classList.add('active');
    btn.onclick = function(){ showMarket(key); };
    nav.appendChild(btn);
  });
}
function showMarket(key) {
  document.querySelectorAll('.market-page').forEach(function(p){ p.setAttribute('hidden',''); });
  var page = document.getElementById('mkt-'+key);
  if (page) page.removeAttribute('hidden');
  document.querySelectorAll('.market-tabs button').forEach(function(b){
    b.classList.toggle('active', b.getAttribute('data-market')===key);
  });
  try{ localStorage.setItem('drops-market', key); }catch(e){}
}
function renderAll() {
  var main = document.getElementById('market-pages');
  main.innerHTML = '';
  Object.keys(DATA.markets).forEach(function(k){ main.appendChild(renderMarketPage(k)); });
  renderTabs();
  var saved; try{ saved = localStorage.getItem('drops-market'); }catch(e){}
  if (saved && DATA.markets[saved]) showMarket(saved);
}
// Delegated click handler — toggles SKU detail rows in the Packaging Pipeline.
document.addEventListener('click', function(e){
  var toggle = e.target.closest && e.target.closest('.sku-toggle');
  if (!toggle) return;
  var block = toggle.closest('tbody.sku-block');
  if (block) block.classList.toggle('collapsed');
});
document.addEventListener('DOMContentLoaded', function() { applyTheme(); renderAll(); });
</script>
</body>
</html>
